name: Test Podman

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every push to main gets a complete run
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  make-test-podman:
    runs-on: ubuntu-latest

    steps:
    # https://github.com/actions/checkout
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # https://github.com/astral-sh/setup-uv
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install
      run: uv sync --locked

    # Ubuntu 26.04 AppArmor blocks the SIGTERM from podman to pasta, which fails container removal.
    # Remove this step once it is fixed: https://bugs.launchpad.net/ubuntu/+source/passt/+bug/2154379
    - name: Allow Podman to signal pasta
      run: |
        sudo sed -i '/include <abstractions\/pasta>/a\  signal (receive) set=(term) peer=podman,' /etc/apparmor.d/usr.bin.pasta
        grep -q 'peer=podman' /etc/apparmor.d/usr.bin.pasta
        sudo apparmor_parser -r /etc/apparmor.d/usr.bin.pasta

    # Linux has no podman machine, so DOCKER_HOST has to be set before make runs
    - name: Start Podman socket
      run: |
        systemctl --user start podman.socket
        echo "DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"

    - name: Test with make
      run: make test-podman
