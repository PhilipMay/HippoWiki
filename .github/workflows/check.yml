name: Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-check:
    env:
      src: "src/hippowiki"
      other_src: "tests"

    runs-on: ubuntu-latest

    steps:
    # https://github.com/actions/checkout
    - uses: actions/checkout@v7

    # https://github.com/astral-sh/setup-uv
    # setup-uv publishes no floating major tag, so pin the full version
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    - name: Install
      run: uv sync --locked --all-extras

    - name: Check with make
      run: make check
